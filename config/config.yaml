# ================================================
# quant-demo 配置文件
# 改这里就能换品种 / 周期 / 策略 / 成本，无需动代码
# ================================================

data:
  symbol: "C0"                  # 玉米主力连续（C0 = 玉米主连，akshare 惯例）
  start_date: "2021-10-01"      # 回测起始（近 5 年）
  end_date: "2026-10-01"        # 回测结束
  raw_dir: "data/raw"           # 原始数据缓存目录
  clean_dir: "data/clean"       # 清洗后数据目录

strategy:
  name: "dual_ma"               # dual_ma 双均线 | bollinger 布林带 | donchian 唐奇安通道
  params:
    dual_ma:
      fast: 5                   # 快均线周期
      slow: 20                  # 慢均线周期
    bollinger:
      window: 20                # 布林带中轨周期
      num_std: 2.0              # 上下轨标准差倍数
    donchian:
      window: 20                # 唐奇安通道周期（突破周期）
  grid:                         # 参数扫描网格（每个策略一份，扫描器自动读取）
    dual_ma: { fast: [5, 10, 15], slow: [20, 40, 60] }
    bollinger: { window: [10, 20, 30], num_std: [1.5, 2.0, 2.5] }
    donchian: { window: [10, 20, 30, 55] }

backtest:
  initial_capital: 100000       # 初始资金（元）
  position_size: 1              # 目标仓位（手）——MVP 固定 1 手
  commission_per_lot: 1.2       # 手续费（元/手），玉米约 1.2
  slippage_ticks: 1             # 滑点（跳数）
  tick_size: 1.0                # 最小变动价位（玉米 1 元/吨）
  contract_multiplier: 10       # 合约乘数（玉米 10 吨/手）
  oos:                          # 样本外验证（训练段择优 → 测试段检验）
    enabled: true               # 是否在报告末尾追加样本外验证
    split_date: "2024-10-01"    # 训练段 <= 该日 < 测试段（优先）
    ratio: 0.7                  # 未指定 split_date 时按比例切分
    metric: "sharpe"            # 训练段择优指标（sharpe/total_return/max_drawdown）

output:
  figure_dir: "output/figures"  # 图表输出目录
  report_dir: "output/reports"  # 报告输出目录

health_check:                   # v1.1 过拟合体检（研究严谨性）：四件套 + DSR
  enabled: true                 # 是否在回测报告中追加「过拟合体检」章节
  monte_carlo:
    enabled: true
    runs: 150                   # 信号随机重排对照次数（越多越稳、越慢）
    bootstrap_runs: 500         # 收益 Bootstrap 路径数（纯 numpy，较快）
    seed: 42                    # 随机种子（保证结果可复现）
  param_neighborhood:
    enabled: true               # 参数邻域细检（围绕当前参数：±档位、悬崖、稳健占比）
  cost_sensitivity:
    enabled: true
    multipliers: [1.5, 2.0, 3.0]  # 成本放大档位（×1 基准自动包含）
  deflated_sharpe:
    enabled: true               # 试验次数取自 strategy.grid（网格组合数）
  thresholds:                   # 判定阈值（报告「过拟合体检」章节按此定级）
    mc_good_percentile: 90      # 蒙特卡洛分位 ≥ 90 → 通过
    mc_warn_percentile: 70      # ≥ 70 → 存疑；否则 不通过
    cost_good_multiplier: 3.0   # 收益归零成本倍数 ≥ 3.0 → 通过
    cost_warn_multiplier: 1.5   # ≥ 1.5 → 存疑；否则 不通过
    dsr_good: 0.95              # Deflated Sharpe ≥ 0.95 → 通过
    dsr_warn: 0.90              # ≥ 0.90 → 存疑；否则 不通过
    stable_fraction_warn: 0.6   # 邻域稳健占比 < 0.6 → 存疑
    oos_usage_warn: 3           # 样本外使用次数 > 3 → 样本外结论降级为存疑

portfolio:                      # v1.2 组合引擎（多品种 · 共享资金池 · 保证金约束）
  initial_capital: 100000       # 共享资金池（8 手全开约占用 4 成）
  sizing:
    mode: fixed                 # fixed | equal_weight | inv_vol
    lots: 1                     # fixed：每品种目标手数
    target_margin_usage: 0.6    # equal_weight / inv_vol：保证金使用率上限
    vol_window: 60              # inv_vol：波动率窗口（交易日）
    max_lots_per_symbol: 10     # 单品种手数上限
  symbols:                      # 品种池（8 中小合约 · 4 板块 · 2026-10-10 核对）
    - { code: RB0, strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: I0,  strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: M0,  strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: P0,  strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: SR0, strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: MA0, strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: TA0, strategy: dual_ma, params: { fast: 5, slow: 20 } }
    - { code: AL0, strategy: dual_ma, params: { fast: 5, slow: 20 } }
  contracts:                    # 合约与成本参数（近似口径，2026-10-10 akshare 核对；可覆盖）
    RB0: { multiplier: 10,  tick_size: 1.0, margin_rate: 0.07, commission_per_lot: 3.1 }
    I0:  { multiplier: 100, tick_size: 0.5, margin_rate: 0.08, commission_per_lot: 6.8 }
    M0:  { multiplier: 10,  tick_size: 1.0, margin_rate: 0.07, commission_per_lot: 1.5 }
    P0:  { multiplier: 10,  tick_size: 2.0, margin_rate: 0.08, commission_per_lot: 2.5 }
    SR0: { multiplier: 10,  tick_size: 1.0, margin_rate: 0.06, commission_per_lot: 2.0 }
    MA0: { multiplier: 10,  tick_size: 1.0, margin_rate: 0.09, commission_per_lot: 3.8 }
    TA0: { multiplier: 5,   tick_size: 2.0, margin_rate: 0.07, commission_per_lot: 3.0 }
    AL0: { multiplier: 5,   tick_size: 5.0, margin_rate: 0.11, commission_per_lot: 3.0 }

# 合约生命周期表（v2.2 · docs/21 T2.2-1）
#
# 用途：到期硬闸的唯一数据源。系统只认真实合约 → 品种的对应关系，以及两个日期：
#   individual_last  自然人客户最后了结日（**硬约束**，闸门只认它）
#   last_trade       最后交易日（参考值，用于展示与复核）
#
# 口径（以交易所公告为准）：
#   SHFE（上期所）  最后交易日 = 交割月 15 日；自然人须在最后交易日前第 3 个交易日收盘前了结
#   DCE（大商所）   最后交易日 = 交割月第 10 个交易日；自然人不得进入交割月 → 前一月末了结
#   CZCE（郑商所）  最后交易日 = 交割月第 10 个交易日；自然人不得进入交割月 → 前一月末了结
#
# 维护方式：换月前跑 `uv run python scripts/roll_plan.py --dry`，人工确认后更新本表。
# 本表缺失某合约 → 该品种状态为 unknown → 禁止开仓（不会静默交易未知合约）。
version: 2026-11-05

